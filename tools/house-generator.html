<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Modular Isométrica - Exportador SVG para Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            overflow-x: hidden;
        }
        /* Animações suaves para os fluxos de energia curvos (Sentido Direto e Inverso) */
        @keyframes energyFlowForward {
            to {
                stroke-dashoffset: -48;
            }
        }
        @keyframes energyFlowReverse {
            to {
                stroke-dashoffset: 48;
            }
        }
        .flow-forward {
            animation: energyFlowForward 1.3s linear infinite;
        }
        .flow-reverse {
            animation: energyFlowReverse 1.3s linear infinite;
        }
        .flow-slow {
            animation: energyFlowForward 2.0s linear infinite;
        }
        /* Padrão de grelha subtil apenas para a pré-visualização quando o fundo transparente está ativo */
        .checkerboard {
            background-image: 
                linear-gradient(45deg, #f1f5f9 25%, transparent 25%), 
                linear-gradient(-45deg, #f1f5f9 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #f1f5f9 75%), 
                linear-gradient(-45deg, transparent 75%, #f1f5f9 75%);
            background-size: 24px 24px;
            background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative select-none">

    <!-- Barra de Ferramentas Flutuante (Topo Direito) -->
    <div class="fixed top-4 right-4 z-50 bg-white/95 backdrop-blur-md border border-slate-200/80 shadow-xl rounded-2xl p-4 w-84 max-h-[92vh] overflow-y-auto transition-all duration-200">
        <div class="flex items-center justify-between border-b border-slate-100 pb-2.5 mb-3">
            <div>
                <h1 class="text-sm font-semibold text-slate-800">Dashboard Energy SVG</h1>
                <p class="text-[11px] text-slate-500">Topologia Curva &amp; EQS Isométrico</p>
            </div>
            <span class="px-2 py-0.5 text-[10px] font-semibold bg-emerald-50 text-emerald-600 rounded-full border border-emerald-200">1200×750</span>
        </div>

        <!-- Presets Rápidos de Cenário Energético -->
        <div class="mb-3.5">
            <p class="text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Cenários Rápidos (Presets)</p>
            <div class="grid grid-cols-2 gap-1.5">
                <button data-preset="clean" class="preset-btn px-2.5 py-1.5 text-[11px] font-medium rounded-lg border border-slate-200 bg-slate-900 text-white hover:bg-slate-800 transition text-left flex items-center justify-between">
                    <span>Sem Fluxos (Limpo)</span>
                    <span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
                </button>
                <button data-preset="battery-only" class="preset-btn px-2.5 py-1.5 text-[11px] font-medium rounded-lg border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition text-left flex items-center justify-between">
                    <span>Só Bateria → Casa</span>
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                </button>
                <button data-preset="solar-day" class="preset-btn px-2.5 py-1.5 text-[11px] font-medium rounded-lg border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition text-left flex items-center justify-between">
                    <span>Dia Solar Completo</span>
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
                </button>
                <button data-preset="ev-charge" class="preset-btn px-2.5 py-1.5 text-[11px] font-medium rounded-lg border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition text-left flex items-center justify-between">
                    <span>Casa → Carregar EQS</span>
                    <span class="w-1.5 h-1.5 rounded-full bg-indigo-500"></span>
                </button>
            </div>
        </div>

        <!-- Controlo Individual de Fluxos Curvos (Topologia Centrada na Casa) -->
        <div class="space-y-1.5 mb-3.5 border-t border-slate-100 pt-2.5">
            <p class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Fluxos de Energia (Curvas Bezier)</p>

            <label class="flex items-center justify-between text-xs text-slate-700 cursor-pointer hover:bg-slate-50 p-1 rounded-lg">
                <span class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                    Solar → Casa (<code class="text-[10px] text-slate-400">#flow-solar-house</code>)
                </span>
                <input type="checkbox" id="toggle-flow-solar" class="rounded text-slate-800 focus:ring-0 cursor-pointer">
            </label>

            <div class="flex items-center justify-between text-xs text-slate-700 hover:bg-slate-50 p-1 rounded-lg">
                <span class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                    Bateria ↔ Casa
                </span>
                <select id="select-flow-battery" class="bg-slate-100 border border-slate-200 text-slate-700 text-[11px] rounded-md px-2 py-0.5 font-medium focus:outline-none cursor-pointer">
                    <option value="off" selected>Inativo</option>
                    <option value="discharge">Bateria → Casa (Alimentar)</option>
                    <option value="charge">Casa → Bateria (Carregar)</option>
                </select>
            </div>

            <label class="flex items-center justify-between text-xs text-slate-700 cursor-pointer hover:bg-slate-50 p-1 rounded-lg">
                <span class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
                    Casa → Carro EQS (<code class="text-[10px] text-slate-400">#flow-house-ev</code>)
                </span>
                <input type="checkbox" id="toggle-flow-ev" class="rounded text-slate-800 focus:ring-0 cursor-pointer">
            </label>

            <div class="flex items-center justify-between text-xs text-slate-700 hover:bg-slate-50 p-1 rounded-lg">
                <span class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-sky-500"></span>
                    Rede ↔ Casa
                </span>
                <select id="select-flow-grid" class="bg-slate-100 border border-slate-200 text-slate-700 text-[11px] rounded-md px-2 py-0.5 font-medium focus:outline-none cursor-pointer">
                    <option value="off" selected>Inativo</option>
                    <option value="import">Rede → Casa (Importar)</option>
                    <option value="export">Casa → Rede (Exportar)</option>
                </select>
            </div>
        </div>

        <!-- Controlo de Camadas e Elementos -->
        <div class="space-y-1.5 mb-3.5 border-t border-slate-100 pt-2.5">
            <p class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Camadas do Edifício (#id)</p>

            <label class="flex items-center justify-between text-xs text-slate-700 cursor-pointer hover:bg-slate-50 p-1 rounded-lg">
                <span class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-600"></span>
                    Jardim e Gravilha (<code class="text-[10px] text-slate-400">#vegetation</code>)
                </span>
                <input type="checkbox" id="toggle-vegetation" checked class="rounded text-slate-800 focus:ring-0 cursor-pointer">
            </label>

            <label class="flex items-center justify-between text-xs text-slate-700 cursor-pointer hover:bg-slate-50 p-1 rounded-lg">
                <span class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
                    Painéis Solares (<code class="text-[10px] text-slate-400">#solar</code>)
                </span>
                <input type="checkbox" id="toggle-solar" checked class="rounded text-slate-800 focus:ring-0 cursor-pointer">
            </label>

            <label class="flex items-center justify-between text-xs text-slate-700 cursor-pointer hover:bg-slate-50 p-1 rounded-lg">
                <span class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-teal-500"></span>
                    Bateria Casa (<code class="text-[10px] text-slate-400">#battery</code>)
                </span>
                <input type="checkbox" id="toggle-battery" checked class="rounded text-slate-800 focus:ring-0 cursor-pointer">
            </label>

            <label class="flex items-center justify-between text-xs text-slate-700 cursor-pointer hover:bg-slate-50 p-1 rounded-lg">
                <span class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-slate-700"></span>
                    Mercedes EQS e Telheiro (<code class="text-[10px] text-slate-400">#ev</code>)
                </span>
                <input type="checkbox" id="toggle-ev" checked class="rounded text-slate-800 focus:ring-0 cursor-pointer">
            </label>

            <label class="flex items-center justify-between text-xs text-slate-700 cursor-pointer hover:bg-slate-50 p-1 rounded-lg">
                <span class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
                    Rede Elétrica (<code class="text-[10px] text-slate-400">#grid</code>)
                </span>
                <input type="checkbox" id="toggle-grid" checked class="rounded text-slate-800 focus:ring-0 cursor-pointer">
            </label>

            <label class="flex items-center justify-between text-xs text-slate-700 cursor-pointer hover:bg-slate-50 p-1 rounded-lg">
                <span class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full border border-slate-400 bg-white"></span>
                    Fundo Branco Puro (#FFFFFF)
                </span>
                <input type="checkbox" id="toggle-bg" checked class="rounded text-slate-800 focus:ring-0 cursor-pointer">
            </label>
        </div>

        <!-- Botões de Exportação -->
        <div class="space-y-2 pt-2 border-t border-slate-100">
            <button id="btn-export-svg" class="w-full py-2.5 px-4 bg-slate-900 hover:bg-slate-800 active:scale-[0.99] text-white font-medium text-xs rounded-xl shadow-sm flex items-center justify-center gap-2 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                Exportar SVG Vetorial
            </button>

            <div class="flex gap-1.5">
                <select id="png-scale" class="bg-slate-100 border border-slate-200 text-slate-700 text-xs rounded-xl px-2.5 py-2 font-medium focus:outline-none">
                    <option value="1">1x (1200×750)</option>
                    <option value="2" selected>2x (2400×1500)</option>
                    <option value="4">4x (4800×3000)</option>
                </select>
                <button id="btn-export-png" class="flex-1 py-2 px-3 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] text-white font-medium text-xs rounded-xl shadow-sm flex items-center justify-center gap-1.5 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    Exportar PNG
                </button>
            </div>

            <button id="btn-copy-svg" class="w-full py-2 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs rounded-xl flex items-center justify-center gap-1.5 transition">
                <span id="copy-label">Copiar Código SVG</span>
            </button>
        </div>
    </div>

    <!-- Área de Visualização Principal do SVG -->
    <div id="canvas-container" class="w-full h-screen flex items-center justify-center p-4 md:p-10 bg-white transition-colors">
        
        <!-- O SVG É TOTALMENTE AUTO-CONTIDO PARA EXPORTAÇÃO DIRETA -->
        <svg id="energy-home-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" class="w-full h-full max-w-[1350px] max-h-[85vh] object-contain">
            <defs>
                <!-- Gradientes de Telhado e Metais -->
                <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#697582"/>
                    <stop offset="50%" stop-color="#586370"/>
                    <stop offset="100%" stop-color="#454f5b"/>
                </linearGradient>
                <linearGradient id="carportRoofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#75818f"/>
                    <stop offset="100%" stop-color="#525d69"/>
                </linearGradient>
                <linearGradient id="fasciaLeft" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#49525c"/>
                    <stop offset="100%" stop-color="#373f47"/>
                </linearGradient>
                <linearGradient id="fasciaRight" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#2c333a"/>
                    <stop offset="100%" stop-color="#1f242a"/>
                </linearGradient>

                <!-- Gradientes de Madeira Modular -->
                <linearGradient id="woodRight" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#d8ba98"/>
                    <stop offset="100%" stop-color="#bf9b75"/>
                </linearGradient>
                <linearGradient id="woodLeft" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#b89672"/>
                    <stop offset="100%" stop-color="#967655"/>
                </linearGradient>
                <linearGradient id="darkWoodLeft" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#4e463f"/>
                    <stop offset="100%" stop-color="#36302b"/>
                </linearGradient>
                <linearGradient id="deckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#cbb092"/>
                    <stop offset="50%" stop-color="#b89b7c"/>
                    <stop offset="100%" stop-color="#a38668"/>
                </linearGradient>

                <!-- Gradientes de Vidro e Interior das Janelas -->
                <linearGradient id="windowGlass" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#3a332c"/>
                    <stop offset="45%" stop-color="#5c4b3b"/>
                    <stop offset="100%" stop-color="#8c755e"/>
                </linearGradient>
                <linearGradient id="windowReflect" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
                    <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
                </linearGradient>
                <linearGradient id="curtainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#e5ded5" stop-opacity="0.85"/>
                    <stop offset="100%" stop-color="#cbbba8" stop-opacity="0.65"/>
                </linearGradient>

                <!-- Gradiente Painel Solar Fotovoltaico -->
                <linearGradient id="solarCell" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#2b4562"/>
                    <stop offset="50%" stop-color="#1d3147"/>
                    <stop offset="100%" stop-color="#101e2e"/>
                </linearGradient>

                <!-- Gradientes Fotorrealistas Vetoriais do Mercedes-Benz EQS (Cinza Prata Metalizado) -->
                <linearGradient id="eqsUpperBody" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#eef1f4"/>
                    <stop offset="30%" stop-color="#cdd3d9"/>
                    <stop offset="70%" stop-color="#a3abb3"/>
                    <stop offset="100%" stop-color="#7a828a"/>
                </linearGradient>
                <linearGradient id="eqsFlankGrad" x1="0%" y1="0%" x2="90%" y2="80%">
                    <stop offset="0%" stop-color="#dde2e6"/>
                    <stop offset="25%" stop-color="#b9c0c6"/>
                    <stop offset="65%" stop-color="#8f979f"/>
                    <stop offset="100%" stop-color="#646b72"/>
                </linearGradient>
                <linearGradient id="eqsLowerSculpt" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#6a7178"/>
                    <stop offset="50%" stop-color="#a9b0b7"/>
                    <stop offset="100%" stop-color="#6e757c"/>
                </linearGradient>
                <linearGradient id="eqsCanopyGlass" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#49535e"/>
                    <stop offset="28%" stop-color="#22282e"/>
                    <stop offset="70%" stop-color="#101317"/>
                    <stop offset="100%" stop-color="#07090b"/>
                </linearGradient>
                <linearGradient id="eqsWindowSide" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#3d4650"/>
                    <stop offset="45%" stop-color="#1b2026"/>
                    <stop offset="100%" stop-color="#0e1114"/>
                </linearGradient>
                <linearGradient id="eqsTailGlow" x1="0%" y1="0%" x2="100%" y2="50%">
                    <stop offset="0%" stop-color="#ff1e27"/>
                    <stop offset="50%" stop-color="#ff5252"/>
                    <stop offset="100%" stop-color="#b90911"/>
                </linearGradient>

                <!-- Gradiente Bateria Doméstica -->
                <linearGradient id="batteryBody" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="100%" stop-color="#dce2e8"/>
                </linearGradient>

                <!-- Filtro de Brilho Subtil para LEDs e Fluxos -->
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="2.5" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                </filter>

                <!-- Componente Reutilizável: Tufo de Erva Ornamental -->
                <g id="grass-tuft-green">
                    <ellipse cx="0" cy="2" rx="14" ry="7" fill="#3a4b3c" opacity="0.35"/>
                    <path d="M0,2 C-4,-8 -12,-14 -18,-12 M0,2 C-2,-10 -8,-18 -12,-20 M0,2 C0,-12 -2,-20 -3,-24 M0,2 C2,-12 6,-20 9,-22 M0,2 C5,-8 12,-14 17,-13 M0,2 C-6,-4 -15,-6 -20,-4 M0,2 C6,-4 15,-6 19,-4" stroke="#4f6d4a" stroke-width="1.6" stroke-linecap="round" fill="none"/>
                    <path d="M0,2 C-3,-9 -7,-15 -10,-17 M0,2 C1,-11 3,-17 5,-19 M0,2 C4,-7 10,-11 13,-10" stroke="#78966d" stroke-width="1.2" stroke-linecap="round" fill="none"/>
                </g>

                <g id="grass-tuft-warm">
                    <ellipse cx="0" cy="2" rx="13" ry="6" fill="#52493c" opacity="0.3"/>
                    <path d="M0,2 C-5,-9 -13,-15 -19,-13 M0,2 C-1,-12 -5,-20 -8,-23 M0,2 C1,-13 4,-21 6,-24 M0,2 C6,-9 13,-15 18,-13 M0,2 C-8,-4 -16,-5 -21,-2" stroke="#9e8c70" stroke-width="1.4" stroke-linecap="round" fill="none"/>
                    <path d="M0,2 C-2,-10 -4,-16 -6,-18 M0,2 C3,-10 7,-16 10,-17" stroke="#c7b699" stroke-width="1.1" stroke-linecap="round" fill="none"/>
                </g>

                <g id="white-plume">
                    <path d="M0,0 C-5,-10 -12,-18 -16,-22 M0,0 C-1,-13 -3,-22 -4,-27 M0,0 C3,-12 8,-20 11,-24" stroke="#dcd6cc" stroke-width="2.2" stroke-linecap="round" fill="none"/>
                    <path d="M0,0 C-3,-8 -8,-14 -11,-17 M0,0 C2,-9 5,-16 7,-19" stroke="#f4f1ea" stroke-width="1.4" stroke-linecap="round" fill="none"/>
                </g>
            </defs>

            <!-- 1. FUNDO BRANCO PURO SEM SOMBRAS PROJETADAS -->
            <rect id="bg-rect" width="1200" height="750" fill="#ffffff"/>

            <!-- ========================================================================= -->
            <!-- 2. CAMADA: JARDIM, GRAVILHA E BASE EXTERIOR (#vegetation)                  -->
            <!-- ========================================================================= -->
            <g id="vegetation">
                <!-- Base de Gravilha (Perímetro Isométrico Direito e Frontal) -->
                <polygon points="295,431 603,609 988,387 680,209" fill="#d5d3ce"/>
                <!-- Rebordo lateral esquerdo e direito da gravilha (espessura 6px) -->
                <polygon points="295,431 603,609 603,615 295,437" fill="#b5b2ac"/>
                <polygon points="603,609 988,387 988,393 603,615" fill="#9e9b95"/>

                <!-- Textura subtil de pedrinhas na gravilha -->
                <g fill="#aca9a2" opacity="0.65">
                    <circle cx="595" cy="590" r="1.5"/><circle cx="608" cy="582" r="1.2"/><circle cx="620" cy="592" r="1.6"/>
                    <circle cx="560" cy="575" r="1.4"/><circle cx="545" cy="562" r="1.8"/><circle cx="580" cy="585" r="1.3"/>
                    <circle cx="650" cy="570" r="1.5"/><circle cx="675" cy="555" r="1.2"/><circle cx="705" cy="540" r="1.7"/>
                    <circle cx="730" cy="522" r="1.4"/><circle cx="775" cy="498" r="1.5"/><circle cx="820" cy="470" r="1.6"/>
                    <circle cx="860" cy="448" r="1.3"/><circle cx="910" cy="418" r="1.5"/><circle cx="485" cy="530" r="1.4"/>
                    <circle cx="445" cy="508" r="1.6"/><circle cx="380" cy="472" r="1.3"/><circle cx="345" cy="450" r="1.5"/>
                </g>

                <!-- Laje de Entrada em Pedra/Betão sobre a Gravilha (Frente-Esquerda) -->
                <polygon points="435,498 518,546 538,534 455,486" fill="#dcdad5" stroke="#b5b2ac" stroke-width="1"/>
                <polygon points="435,498 518,546 518,549 435,501" fill="#a8a59e"/>
            </g>

            <!-- ========================================================================= -->
            <!-- 3. CAMADA: CARRO EQS E TELHEIRO (#ev)                                     -->
            <!-- ========================================================================= -->
            <g id="ev">
                <!-- Laje de Betão Limpa debaixo do Carro (Sem Sombras no Chão) -->
                <polygon points="182,366 312,441 465,353 335,278" fill="#eaedf0"/>
                <polygon points="182,366 312,441 312,444 182,369" fill="#d0d5dc"/>

                <!-- Arbustos de fundo junto ao telheiro -->
                <use href="#grass-tuft-green" x="385" y="295" transform="scale(1.1)"/>
                <use href="#grass-tuft-warm" x="415" y="280"/>

                <!-- Pilar Traseiro Esquerdo do Telheiro -->
                <polygon points="205,274 211,277 211,375 205,372" fill="#4f5861"/>
                <polygon points="211,277 216,274 216,372 211,375" fill="#32383e"/>

                <!-- ========================================================================= -->
                <!-- MERCEDES-BENZ EQS (Redesenho Isométrico 3D Fiel - Design "One-Bow" Fluido) -->
                <!-- Estacionado sob o telheiro, visto de 3/4 Traseira-Direita (como na ref.)   -->
                <!-- ========================================================================= -->
                <g id="mercedes-eqs">
                    <!-- Sombra de contacto estritamente sob o chassis (Sem sombra espalhada no chão) -->

    <!-- Script de Controlo de Camadas, Fluxos Curvos e Exportação Vetorial/PNG -->
    <script>
        const svgElement = document.getElementById('energy-home-svg');
        const bgRect = document.getElementById('bg-rect');
        const canvasContainer = document.getElementById('canvas-container');

        // Elementos de controlo de fluxos
        const cbFlowSolar = document.getElementById('toggle-flow-solar');
        const selFlowBattery = document.getElementById('select-flow-battery');
        const cbFlowEv = document.getElementById('toggle-flow-ev');
        const selFlowGrid = document.getElementById('select-flow-grid');

        // Grupos SVG dos fluxos
        const grpFlowSolar = document.getElementById('flow-solar-house');
        const grpFlowBattery = document.getElementById('flow-battery-house');
        const pathBatteryHouse = document.getElementById('path-battery-house');
        const grpFlowEv = document.getElementById('flow-house-ev');
        const grpFlowGrid = document.getElementById('flow-grid-house');
        const pathGridHouse = document.getElementById('path-grid-house');
        const grpHouseHub = document.getElementById('house-energy-hub');

        // Atualiza a visibilidade e direção dos fluxos curvos centrados na casa
        function updateEnergyFlows() {
            const solarActive = cbFlowSolar.checked;
            const batteryMode = selFlowBattery.value; // 'off' | 'discharge' (Bateria->Casa) | 'charge' (Casa->Bateria)
            const evActive = cbFlowEv.checked;
            const gridMode = selFlowGrid.value; // 'off' | 'import' (Rede->Casa) | 'export' (Casa->Rede)

            // 1. Solar -> Casa
            grpFlowSolar.classList.toggle('hidden', !solarActive);

            // 2. Bateria <-> Casa
            if (batteryMode === 'off') {
                grpFlowBattery.classList.add('hidden');
            } else {
                grpFlowBattery.classList.remove('hidden');
                if (batteryMode === 'discharge') {
                    // Bateria alimenta a Casa (462,338 -> 585,345)
                    pathBatteryHouse.classList.remove('flow-reverse');
                    pathBatteryHouse.classList.add('flow-forward');
                } else {
                    // Casa carrega a Bateria (585,345 -> 462,338)
                    pathBatteryHouse.classList.remove('flow-forward');
                    pathBatteryHouse.classList.add('flow-reverse');
                }
            }

            // 3. Casa -> Carro EQS
            grpFlowEv.classList.toggle('hidden', !evActive);

            // 4. Rede <-> Casa
            if (gridMode === 'off') {
                grpFlowGrid.classList.add('hidden');
            } else {
                grpFlowGrid.classList.remove('hidden');
                if (gridMode === 'import') {
                    pathGridHouse.classList.remove('flow-reverse');
                    pathGridHouse.classList.add('flow-forward');
                } else {
                    pathGridHouse.classList.remove('flow-forward');
                    pathGridHouse.classList.add('flow-reverse');
                }
            }

            // Mostrar o Hub Central da Casa se pelo menos um fluxo estiver ativo
            const anyFlowActive = solarActive || batteryMode !== 'off' || evActive || gridMode !== 'off';
            grpHouseHub.classList.toggle('hidden', !anyFlowActive);
        }

        cbFlowSolar.addEventListener('change', updateEnergyFlows);
        selFlowBattery.addEventListener('change', updateEnergyFlows);
        cbFlowEv.addEventListener('change', updateEnergyFlows);
        selFlowGrid.addEventListener('change', updateEnergyFlows);

        // Presets Rápidos de Cenário
        const presetButtons = document.querySelectorAll('.preset-btn');
        presetButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const preset = btn.getAttribute('data-preset');

                // Atualizar estilo visual dos botões de preset
                presetButtons.forEach(b => {
                    b.classList.remove('bg-slate-900', 'text-white', 'hover:bg-slate-800');
                    b.classList.add('bg-slate-50', 'text-slate-700', 'hover:bg-slate-100');
                });
                btn.classList.remove('bg-slate-50', 'text-slate-700', 'hover:bg-slate-100');
                btn.classList.add('bg-slate-900', 'text-white', 'hover:bg-slate-800');

                if (preset === 'clean') {
                    cbFlowSolar.checked = false;
                    selFlowBattery.value = 'off';
                    cbFlowEv.checked = false;
                    selFlowGrid.value = 'off';
                } else if (preset === 'battery-only') {
                    // A Bateria é a única fonte a alimentar a Casa (ex: noite/autonomia)
                    cbFlowSolar.checked = false;
                    selFlowBattery.value = 'discharge';
                    cbFlowEv.checked = false;
                    selFlowGrid.value = 'off';
                } else if (preset === 'solar-day') {
                    // Dia Solar: Painéis alimentam a Casa, que carrega a Bateria e o EQS
                    cbFlowSolar.checked = true;
                    selFlowBattery.value = 'charge';
                    cbFlowEv.checked = true;
                    selFlowGrid.value = 'export';
                } else if (preset === 'ev-charge') {
                    // Bateria e/ou Solar alimentam a Casa, e a Casa carrega o EQS
                    cbFlowSolar.checked = false;
                    selFlowBattery.value = 'discharge';
                    cbFlowEv.checked = true;
                    selFlowGrid.value = 'off';
                }

                updateEnergyFlows();
            });
        });

        // Mapeamento dos checkboxes para os grupos estruturais do SVG
        const layerToggles = [
            { checkbox: 'toggle-vegetation', targetIds: ['vegetation', 'vegetation-foreground', 'planter-left', 'planter-center', 'planter-back'] },
            { checkbox: 'toggle-solar', targetIds: ['solar'] },
            { checkbox: 'toggle-battery', targetIds: ['battery'] },
            { checkbox: 'toggle-ev', targetIds: ['ev'] },
            { checkbox: 'toggle-grid', targetIds: ['grid'] }
        ];

        layerToggles.forEach(item => {
            const cb = document.getElementById(item.checkbox);
            cb.addEventListener('change', (e) => {
                item.targetIds.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        if (e.target.checked) {
                            el.classList.remove('hidden');
                        } else {
                            el.classList.add('hidden');
                        }
                    }
                });
            });
        });

        // Alternar Fundo Branco vs Transparente
        document.getElementById('toggle-bg').addEventListener('change', (e) => {
            if (e.target.checked) {
                bgRect.setAttribute('fill', '#ffffff');
                bgRect.removeAttribute('fill-opacity');
                canvasContainer.classList.remove('checkerboard');
                canvasContainer.classList.add('bg-white');
            } else {
                bgRect.setAttribute('fill-opacity', '0');
                canvasContainer.classList.remove('bg-white');
                canvasContainer.classList.add('checkerboard');
            }
        });

        // Função para obter a string SVG limpa e pronta para produção
        function getSerializedSVG() {
            const clone = svgElement.cloneNode(true);
            clone.removeAttribute('class');
            clone.setAttribute('width', '1200');
            clone.setAttribute('height', '750');
            
            // Remover elementos que estão com a classe 'hidden' para um ficheiro limpo
            clone.querySelectorAll('.hidden').forEach(el => el.remove());

            const serializer = new XMLSerializer();
            let source = serializer.serializeToString(clone);

            if (!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
                source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
            }
            return '<?xml version="1.0" standalone="no"?>\r\n' + source;
        }

        // Exportar Ficheiro .SVG
        document.getElementById('btn-export-svg').addEventListener('click', () => {
            const svgString = getSerializedSVG();
            const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = 'casa-modular-energia-dashboard.svg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });

        // Exportar Ficheiro .PNG na resolução escolhida (1x, 2x, 4x)
        document.getElementById('btn-export-png').addEventListener('click', () => {
            const scale = parseInt(document.getElementById('png-scale').value, 10) || 2;
            const width = 1200 * scale;
            const height = 750 * scale;

            const svgString = getSerializedSVG();
            const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);

            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                URL.revokeObjectURL(url);

                canvas.toBlob((pngBlob) => {
                    const pngUrl = URL.createObjectURL(pngBlob);
                    const link = document.createElement('a');
                    link.href = pngUrl;
                    link.download = `casa-modular-energia-${width}x${height}.png`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(pngUrl);
                }, 'image/png');
            };
            img.src = url;
        });

        // Copiar Código SVG para a Área de Transferência
        document.getElementById('btn-copy-svg').addEventListener('click', () => {
            const svgString = getSerializedSVG();
            const tempInput = document.createElement('textarea');
            tempInput.value = svgString;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            const label = document.getElementById('copy-label');
            const originalText = label.innerText;
            label.innerText = 'Código SVG Copiado!';
            setTimeout(() => {
                label.innerText = originalText;
            }, 2000);
        });
    </script>
</body>
</html>
